<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nasu Chat</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; margin: 0; }
  #box { max-width: 480px; margin: 20px auto; background: #1b1b1b; border-radius: 12px; overflow: hidden; }
  #head { background: #c8e64a; color: #111; padding: 14px; font-weight: bold; }
  #msgs { height: 420px; overflow-y: auto; padding: 12px; }
  .m { margin: 8px 0; padding: 10px 12px; border-radius: 10px; max-width: 80%; white-space: pre-wrap; }
  .u { background: #c8e64a; color: #111; margin-left: auto; }
  .b { background: #333; color: #fff; }
  .wa { display: block; margin: 8px 0; padding: 12px; background: #25d366; color: #fff; text-align: center; border-radius: 10px; text-decoration: none; font-weight: bold; max-width: 80%; }
  #row { display: flex; border-top: 1px solid #333; }
  #inp { flex: 1; padding: 14px; border: 0; background: #222; color: #fff; font-size: 16px; }
  #btn { padding: 0 18px; border: 0; background: #c8e64a; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div id="box">
  <div id="head">Nasu Assistant</div>
  <div id="msgs"></div>
  <div id="row">
    <input id="inp" placeholder="Type your message..." dir="auto">
    <button id="btn">Send</button>
  </div>
</div>
<script>
  const msgs = document.getElementById("msgs");
  const inp = document.getElementById("inp");
  const history = [];

  function add(text, cls) {
    const d = document.createElement("div");
    d.className = "m " + cls;
    d.dir = "auto";
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  function addWhatsAppButton(link) {
    const a = document.createElement("a");
    a.className = "wa";
    a.href = link;
    a.target = "_blank";
    a.textContent = "📲 Send order on WhatsApp";
    msgs.appendChild(a);
    msgs.scrollTop = msgs.scrollHeight;
  }

  async function send() {
    const text = inp.value.trim();
    if (!text) return;
    inp.value = "";
    add(text, "u");
    const wait = add("...", "b");
    try {
      const r = await fetch("http://localhost:3000/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: history })
      });
      const data = await r.json();
      wait.textContent = data.reply;
      history.push({ role: "user", text: text });
      history.push({ role: "model", text: data.reply });
      if (data.whatsappLink) addWhatsAppButton(data.whatsappLink);
    } catch (e) {
      wait.textContent = "Server not reachable. Is the bot running?";
    }
  }

  document.getElementById("btn").onclick = send;
  inp.addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });
  add("Assalam o Alaikum! Welcome to Nasu. How can I help you?", "b");
</script>
</body>
</html>
